name: Validate website SEO

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check metadata, canonicals, sitemap and internal links
        run: |
          node scripts/build-agent-site-index.cjs
          node scripts/check-seo.cjs
          git diff --exit-code refugee-agent-site-index.js
