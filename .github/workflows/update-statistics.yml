name: Update Refugee Statistics

on:
  schedule:
    # Check hourly; UNHCR source values change on their own reporting cadence.
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fetchStatistics.js
      - .github/workflows/update-statistics.yml

permissions:
  contents: write

concurrency:
  group: update-refugee-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch UNHCR statistics
        run: node fetchStatistics.js

      - name: Commit changed statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statistics.json
          git diff --cached --quiet && exit 0
          git commit -m "Update refugee statistics"
          git pull --rebase origin main
          git push
