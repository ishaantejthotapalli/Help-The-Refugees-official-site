<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | Help The Refugees</title>

<link rel="stylesheet" href="/Help-The-Refugees-official-site/style.css">
<link rel="icon" href="/Help-The-Refugees-official-site/images/logo.png">

<style>
.error-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

.error-box{
    max-width:700px;
}

.error-box h1{
    font-size:96px;
    margin-bottom:10px;
}

.error-box h2{
    margin-bottom:20px;
}

.error-box p{
    margin-bottom:30px;
    line-height:1.6;
}

.home-btn{
    display:inline-block;
    background:#2b7cff;
    color:white;
    text-decoration:none;
    padding:14px 28px;
    border-radius:10px;
    font-weight:bold;
    transition:.25s;
}

.home-btn:hover{
    background:#1d5fd1;
    transform:translateY(-2px);
}
</style>

</head>

<body>

<div class="error-page">

<div class="error-box">

<img src="/Help-The-Refugees-official-site/images/logo.png"
     alt="Help The Refugees"
     width="120">

<h1>404</h1>

<h2>Page Not Found</h2>

<p>
Sorry, the page you're looking for doesn't exist or may have been moved.
</p>

<a class="home-btn"
   href="/Help-The-Refugees-official-site/">
🏠 Go to Home
</a>

</div>

</div>

<script>
// If someone presses Back then Home again,
// always return to the site root.
document.querySelector(".home-btn").addEventListener("click", function(e){
    e.preventDefault();
    window.location.href = "/Help-The-Refugees-official-site/";
});
</script>

</body>

</html>
